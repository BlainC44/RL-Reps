<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img">
<title>Where to hit the ball to aim at the goal (view from above)</title>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}</style>

<defs>
  <g id="tcar">
    <rect x="-13" y="-22" width="26" height="44" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <path d="M-10,-10 L10,-10 L8,-2 L-8,-2 Z" fill="#bfe3ff"/>
    <rect x="-9" y="6" width="18" height="8" rx="2" fill="#1d4ed8"/>
    <rect x="-12" y="-22" width="6" height="3" fill="#ffe08a"/><rect x="6" y="-22" width="6" height="3" fill="#ffe08a"/>
  </g>
  <g id="tball">
    <circle r="14" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <path d="M-9,-10 Q0,-3 9,-10 M-13,4 Q0,0 13,4" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  </g>
</defs>
<rect width="640" height="320" fill="#11141b"/>
<rect width="640" height="320" fill="#17251c"/><line x1="0" x2="640" y1="60" y2="60" stroke="#1d3324" stroke-width="1"/><line x1="0" x2="640" y1="120" y2="120" stroke="#1d3324" stroke-width="1"/><line x1="0" x2="640" y1="180" y2="180" stroke="#1d3324" stroke-width="1"/><line x1="0" x2="640" y1="240" y2="240" stroke="#1d3324" stroke-width="1"/><line x1="0" x2="640" y1="300" y2="300" stroke="#1d3324" stroke-width="1"/>
<rect x="260" y="10" width="120" height="30" fill="#1b2a3a" stroke="#e9ecf2" stroke-width="2"/>
    <line x1="230" x2="410" y1="40" y2="40" stroke="#e9ecf2" stroke-width="3"/>
    <text x="320" y="31" font-size="13" font-weight="700" text-anchor="middle" fill="#e9ecf2">GOAL</text>
<line x1="320" y1="40" x2="320" y2="210" stroke="#ff7a1a" stroke-width="2" stroke-dasharray="6 6" opacity=".8"/>
<g transform="translate(320 150)"><use href="#tball"/></g>
<g transform="translate(320 166)"><circle r="7" fill="none" stroke="#ff7a1a" stroke-width="3"/><circle r="2.5" fill="#ff7a1a"/></g>
<g transform="translate(320 205)"><use href="#tcar"/></g>
<g opacity=".3"><g transform="translate(250 240) rotate(25)"><use href="#tcar"/></g><g transform="translate(130 290) rotate(40)"><use href="#tcar"/></g></g>
<path d="M352,140 L352,60" stroke="#3ccf8e" stroke-width="4" marker-end="url(#arrow)"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#3ccf8e"/></marker></defs>
<text x="362" y="100" font-size="14" font-weight="700" fill="#3ccf8e">ball travels this way</text>
<line x1="338" y1="168" x2="430" y2="190" stroke="#ff7a1a" stroke-width="1.5"/>
<text x="436" y="186" font-size="14" font-weight="700" fill="#ff7a1a">hit here:</text>
<text x="436" y="204" font-size="13" fill="#e9ecf2">the side facing</text>
<text x="436" y="220" font-size="13" fill="#e9ecf2">away from the goal</text>
<text x="200" y="276" font-size="12" fill="#8a93a6">approach, then line up</text>
<text x="628" y="310" font-size="11" text-anchor="end" fill="#8a93a6">View from above · simplified illustration</text>
</svg>
