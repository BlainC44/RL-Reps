  <rect x="-35" y="9" width="12" height="9" rx="3" fill="#1f2229"/><rect x="23" y="9" width="12" height="9" rx="3" fill="#1f2229"/>
</g>
<marker id="ah2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ff7a1a"/></marker>
<marker id="ahg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3ccf8e"/></marker>
</defs>
<rect width="640" height="280" fill="#11141b"/>
<rect x="6" y="6" width="201.33333333333334" height="268" rx="12" fill="#151923" stroke="#2a2f3b"/>
      <text x="106.66666666666667" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#e9ecf2">Stick left/right</text>
      <g transform="translate(106.66666666666667 120)"><g opacity=".3"><use href="#tcar"/></g><g transform="rotate(35)"><use href="#tcar"/></g><path d="M-8,-44 A44,44 0 0 1 30,-30" fill="none" stroke="#ff7a1a" stroke-width="3" marker-end="url(#ah2)"/><text y="-62" font-size="11" text-anchor="middle" fill="#8a93a6">seen from above</text></g>
      <g transform="translate(106.66666666666667 192)">
    <circle r="15" fill="#1b1f29" stroke="#2f3646"/>
    <circle cx="8" cy="0" r="6" fill="#ff7a1a"/>
    
    
  </g>
      <text x="106.66666666666667" y="262" font-size="13" font-weight="700" text-anchor="middle" fill="#ff7a1a">turns the car (yaw)</text>
<rect x="219.33333333333334" y="6" width="201.33333333333334" height="268" rx="12" fill="#151923" stroke="#2a2f3b"/>
      <text x="320" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#e9ecf2">Hold air roll + left/right</text>
      <g transform="translate(320 120)"><g opacity=".3"><use href="#rcar"/></g><g transform="rotate(35)"><use href="#rcar"/></g><path d="M-41.57,-24 A48,48 0 0 1 41.57,-24" fill="none" stroke="#ff7a1a" stroke-width="3" marker-end="url(#ah2)"/><text y="-62" font-size="11" text-anchor="middle" fill="#8a93a6">seen from behind</text></g>
      <g transform="translate(320 192)">
    <circle r="15" fill="#1b1f29" stroke="#2f3646"/>
    <circle cx="8" cy="0" r="6" fill="#ff7a1a"/>
    <rect x="-26" y="19" width="52" height="15" rx="7.5" fill="#f472b6"/><text y="30" font-size="9" font-weight="800" text-anchor="middle" fill="#14161c">AIR ROLL</text>
    
  </g>
      <text x="320" y="262" font-size="13" font-weight="700" text-anchor="middle" fill="#ff7a1a">rolls the car</text>
<rect x="432.6666666666667" y="6" width="201.33333333333334" height="268" rx="12" fill="#151923" stroke="#2a2f3b"/>
      <text x="533.3333333333334" y="32" font-size="14" font-weight="700" text-anchor="middle" fill="#e9ecf2">Stick back/forward</text>
      <g transform="translate(533.3333333333334 120)"><g opacity=".3"><use href="#car"/></g><g transform="rotate(-30)"><use href="#car"/></g><path d="M50,8 A50,50 0 0 0 40,-30" fill="none" stroke="#ff7a1a" stroke-width="3" marker-end="url(#ah2)"/><text y="-62" font-size="11" text-anchor="middle" fill="#8a93a6">seen from the side</text></g>
      <g transform="translate(533.3333333333334 192)">
    <circle r="15" fill="#1b1f29" stroke="#2f3646"/>
    <circle cx="0" cy="8" r="6" fill="#ff7a1a"/>
    
    
  </g>
      <text x="533.3333333333334" y="262" font-size="13" font-weight="700" text-anchor="middle" fill="#ff7a1a">tilts nose up/down (pitch)</text>
</svg>
