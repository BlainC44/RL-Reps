<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 254" width="640" height="254" role="img">
<title>The bounce power shot — step by step</title>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}</style>

<defs>
  <g id="car">
    <path d="M-38,-2 L-38,-11 Q-38,-15 -34,-15 L-20,-15 L-10,-27 L16,-27 L27,-15 L35,-15 Q39,-15 39,-11 L39,-2 Q39,2 35,2 L-34,2 Q-38,2 -38,-2 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <path d="M-16,-15 L-8,-24 L5,-24 L5,-15 Z" fill="#bfe3ff"/>
    <path d="M8,-24 L14,-24 L22,-15 L8,-15 Z" fill="#bfe3ff"/>
    <rect x="34" y="-11" width="5" height="4" rx="1" fill="#ffe08a"/>
    <rect x="-38" y="-11" width="3" height="4" fill="#ef4444"/>
    <circle cx="-23" cy="4" r="8" fill="#1f2229" stroke="#4b5563" stroke-width="1.5"/><circle cx="-23" cy="4" r="3" fill="#9ca3af"/>
    <circle cx="24" cy="4" r="8" fill="#1f2229" stroke="#4b5563" stroke-width="1.5"/><circle cx="24" cy="4" r="3" fill="#9ca3af"/>
  </g>
  <g id="flame">
    <path d="M-38,-13 L-66,-8 L-38,-3 Z" fill="#ff7a1a"/>
    <path d="M-38,-11 L-54,-8 L-38,-5 Z" fill="#ffd166"/>
  </g>
  <g id="ball">
    <circle r="18" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <path d="M-12,-13 Q0,-4 12,-13 M-17,5 Q0,0 17,5 M-6,17 Q0,8 6,17" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  </g>
</defs><defs><marker id="rollhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ff7a1a"/></marker></defs>
<rect width="640" height="254" fill="#11141b"/>
<g>
      <clipPath id="p0"><rect x="4" y="4" width="205.33333333333334" height="182" rx="10"/></clipPath>
      <rect x="4" y="4" width="205.33333333333334" height="182" rx="10" fill="#151923" stroke="#2a2f3b"/>
      <g clip-path="url(#p0)">
        <rect x="0" y="160" width="213.33333333333334" height="30" fill="#17251c"/>
        <line x1="0" x2="213.33333333333334" y1="160" y2="160" stroke="#2f6b3f" stroke-width="2"/>
        <g transform="translate(306.38 128.94) scale(1)"><use href="#ball"/></g>
        
        
        
        <g transform="translate(106.67 148) scale(1) rotate(0) scale(1 1)">
          <use href="#flame"/><use href="#car"/>
        </g>
        
      </g>
      <circle cx="22" cy="24" r="12" fill="#ff7a1a"/>
      <text x="22" y="28.5" font-size="13" font-weight="800" text-anchor="middle" fill="#14161c">1</text>
      <text x="106.66666666666667" y="208" font-size="13" font-weight="600" text-anchor="middle" fill="#e9ecf2">Read the bounce, drive to</text><text x="106.66666666666667" y="225" font-size="13" font-weight="500" text-anchor="middle" fill="#e9ecf2">meet it</text>
    </g>
<g>
      <clipPath id="p1"><rect x="217.33333333333334" y="4" width="205.33333333333334" height="182" rx="10"/></clipPath>
      <rect x="217.33333333333334" y="4" width="205.33333333333334" height="182" rx="10" fill="#151923" stroke="#2a2f3b"/>
      <g clip-path="url(#p1)">
        <rect x="213.33333333333334" y="160" width="213.33333333333334" height="30" fill="#17251c"/>
        <line x1="213.33333333333334" x2="426.6666666666667" y1="160" y2="160" stroke="#2f6b3f" stroke-width="2"/>
        <g transform="translate(385.6 111.28) scale(1)"><use href="#ball"/></g>
        
        
        
        <g transform="translate(320 134) scale(1) rotate(-5) scale(1 1)">
          <use href="#car"/>
        </g>
        
      </g>
      <circle cx="235.33333333333334" cy="24" r="12" fill="#ff7a1a"/>
      <text x="235.33333333333334" y="28.5" font-size="13" font-weight="800" text-anchor="middle" fill="#14161c">2</text>
      <text x="320" y="208" font-size="13" font-weight="600" text-anchor="middle" fill="#e9ecf2">Jump as it comes up</text>
    </g>
<g>
      <clipPath id="p2"><rect x="430.6666666666667" y="4" width="205.33333333333334" height="182" rx="10"/></clipPath>
      <rect x="430.6666666666667" y="4" width="205.33333333333334" height="182" rx="10" fill="#151923" stroke="#2a2f3b"/>
      <g clip-path="url(#p2)">
        <rect x="426.6666666666667" y="160" width="213.33333333333334" height="30" fill="#17251c"/>
        <line x1="426.6666666666667" x2="640" y1="160" y2="160" stroke="#2f6b3f" stroke-width="2"/>
        <g transform="translate(573.33 110) scale(1)"><use href="#ball"/></g>
        
        
        
        <g transform="translate(533.33 126) scale(1) rotate(25) scale(1 1)">
          <use href="#car"/>
        </g>
        
      </g>
      <circle cx="448.6666666666667" cy="24" r="12" fill="#ff7a1a"/>
      <text x="448.6666666666667" y="28.5" font-size="13" font-weight="800" text-anchor="middle" fill="#14161c">3</text>
      <text x="533.3333333333334" y="208" font-size="13" font-weight="600" text-anchor="middle" fill="#e9ecf2">Flip into it: nose or corner</text>
    </g>
