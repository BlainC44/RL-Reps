<path d="M320,152 L320,48" stroke="#3ccf8e" stroke-width="3"  marker-end="url(#ahg)"/>
<circle cx="118" cy="248" r="11" fill="#ff7a1a"/><text x="118" y="252.5" font-size="12" font-weight="800" text-anchor="middle" fill="#14161c">1</text>
<text x="134" y="252" font-size="13" font-weight="600" text-anchor="start" fill="#e9ecf2">Speed into the ball (yours + the ball’s)</text>
<circle cx="390" cy="196" r="11" fill="#ff7a1a"/><text x="390" y="200.5" font-size="12" font-weight="800" text-anchor="middle" fill="#14161c">2</text>
<text x="406" y="200" font-size="13" font-weight="600" text-anchor="start" fill="#e9ecf2">Hit it with your nose or front corner</text>
<circle cx="390" cy="106" r="11" fill="#ff7a1a"/><text x="390" y="110.5" font-size="12" font-weight="800" text-anchor="middle" fill="#14161c">3</text>
<text x="406" y="110" font-size="13" font-weight="600" text-anchor="start" fill="#e9ecf2">Flip direction = shot direction</text>
<text x="628" y="310" font-size="11" font-weight="400" text-anchor="end" fill="#8a93a6">View from above · simplified illustration</text>
