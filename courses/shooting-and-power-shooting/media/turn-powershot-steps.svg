<g transform="translate(298 176) rotate(48)"><use href="#tcar"/></g>
<g transform="translate(320 150)"><use href="#tball"/></g>
<path d="M326,134 L360,48" stroke="#3ccf8e" stroke-width="3"  marker-end="url(#ahg)"/>
<circle cx="232" cy="300" r="11" fill="#ff7a1a"/><text x="232" y="304.5" font-size="12" font-weight="800" text-anchor="middle" fill="#14161c">1</text>
<text x="150" y="304" font-size="13" font-weight="600" text-anchor="start" fill="#e9ecf2">Stay close</text>
<circle cx="232" cy="230" r="11" fill="#ff7a1a"/><text x="232" y="234.5" font-size="12" font-weight="800" text-anchor="middle" fill="#14161c">2</text>
<text x="70" y="234" font-size="13" font-weight="600" text-anchor="start" fill="#e9ecf2">Drift to one side</text>
<circle cx="272" cy="160" r="11" fill="#ff7a1a"/><text x="272" y="164.5" font-size="12" font-weight="800" text-anchor="middle" fill="#14161c">3</text>
<text x="120" y="150" font-size="13" font-weight="600" text-anchor="start" fill="#e9ecf2">Turn into it — no flip</text>
<text x="380" y="110" font-size="12" font-weight="700" text-anchor="start" fill="#3ccf8e">nose or corner hits it</text>
<text x="628" y="310" font-size="11" font-weight="400" text-anchor="end" fill="#8a93a6">View from above · simplified illustration</text>
