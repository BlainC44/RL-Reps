<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img">
<title>Turning with and without a short powerslide (view from above)</title>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}</style>

<defs>
  <g id="tcar">
    <rect x="-13" y="-22" width="26" height="44" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <path d="M-10,-10 L10,-10 L8,-2 L-8,-2 Z" fill="#bfe3ff"/>
    <rect x="-9" y="6" width="18" height="8" rx="2" fill="#1d4ed8"/>
    <rect x="-12" y="-22" width="6" height="3" fill="#ffe08a"/><rect x="6" y="-22" width="6" height="3" fill="#ffe08a"/>
  </g>
  <g id="tball">
    <circle r="14" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <path d="M-9,-10 Q0,-3 9,-10 M-13,4 Q0,0 13,4" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  </g>
</defs>
<rect width="640" height="320" fill="#11141b"/>
<rect width="640" height="320" fill="#17251c"/><line x1="0" x2="640" y1="60" y2="60" stroke="#1d3324" stroke-width="1"/><line x1="0" x2="640" y1="120" y2="120" stroke="#1d3324" stroke-width="1"/><line x1="0" x2="640" y1="180" y2="180" stroke="#1d3324" stroke-width="1"/><line x1="0" x2="640" y1="240" y2="240" stroke="#1d3324" stroke-width="1"/><line x1="0" x2="640" y1="300" y2="300" stroke="#1d3324" stroke-width="1"/>
<line x1="320" x2="320" y1="0" y2="320" stroke="#11141b" stroke-width="6"/>
<text x="160" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#e9ecf2">No powerslide</text>
<text x="160" y="46" font-size="12" text-anchor="middle" fill="#8a93a6">wide, slow turn</text>
<path d="M92,290 L92,140 A78,78 0 0 1 248,140 L248,290" fill="none" stroke="#e9ecf2" stroke-width="2" stroke-dasharray="4 8" opacity=".4"/>
<g opacity="0.4" transform="translate(92 140) rotate(0)"><use href="#tcar"/></g>
<g opacity="0.7" transform="translate(170 62) rotate(90)"><use href="#tcar"/></g>
<g opacity="1" transform="translate(248 140) rotate(180)"><use href="#tcar"/></g>
<text x="480" y="28" font-size="15" font-weight="700" text-anchor="middle" fill="#e9ecf2">Short powerslide</text>
<text x="480" y="46" font-size="12" text-anchor="middle" fill="#8a93a6">tight, quick turn</text>
<path d="M440,290 L440,140 A30,30 0 0 1 500,140 L500,290" fill="none" stroke="#e9ecf2" stroke-width="2" stroke-dasharray="4 8" opacity=".4"/>
<path d="M431,140 A39,39 0 0 1 509,140 M449,140 A21,21 0 0 1 491,140" fill="none" stroke="#0b0d12" stroke-width="5" opacity=".7"/>
<g opacity="0.4" transform="translate(440 140) rotate(0)"><use href="#tcar"/></g>
<g opacity="0.7" transform="translate(470 110) rotate(112)"><use href="#tcar"/></g>
<g opacity="1" transform="translate(500 140) rotate(180)"><use href="#tcar"/></g>
<rect x="530" y="62" width="96" height="24" rx="12" fill="#ff7a1a"/><text x="578" y="79" font-size="12" font-weight="800" text-anchor="middle" fill="#14161c">POWERSLIDE</text>
<text x="628" y="310" font-size="11" text-anchor="end" fill="#8a93a6">View from above · simplified illustration</text>
</svg>
