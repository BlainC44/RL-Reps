  </g>
</defs><defs><marker id="rollhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ff7a1a"/></marker></defs>
<rect width="640" height="254" fill="#11141b"/>
<g>
      <clipPath id="p0"><rect x="4" y="4" width="152" height="182" rx="10"/></clipPath>
      <rect x="4" y="4" width="152" height="182" rx="10" fill="#151923" stroke="#2a2f3b"/>
      <g clip-path="url(#p0)">
