<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 382" width="640" height="382" role="img">
<title>Catch and dump to the corner: step by step</title>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}</style>

<defs>
  <g id="tcar">
    <rect x="-13" y="-22" width="26" height="44" rx="6" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <path d="M-10,-10 L10,-10 L8,-2 L-8,-2 Z" fill="#bfe3ff"/>
    <rect x="-9" y="6" width="18" height="8" rx="2" fill="#1d4ed8"/>
    <rect x="-12" y="-22" width="6" height="3" fill="#ffe08a"/><rect x="6" y="-22" width="6" height="3" fill="#ffe08a"/>
  </g>
  <g id="tball">
    <circle r="14" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <path d="M-9,-10 Q0,-3 9,-10 M-13,4 Q0,0 13,4" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  </g>
</defs>
<rect width="640" height="382" fill="#11141b"/>
<rect width="640" height="300" fill="#1c2a22"/>
<rect x="0" y="262" width="640" height="38" fill="#17251c"/><line x1="0" x2="640" y1="262" y2="262" stroke="#2f6b3f" stroke-width="2"/>
<rect x="230" y="196" width="180" height="66" fill="#0b0f16" stroke="#e9ecf2" stroke-width="4"/>
<text x="320" y="236" font-size="12" font-weight="700" text-anchor="middle" fill="#8a93a6">YOUR GOAL</text>
<path d="M0,0 Q40,150 0,262" fill="#13201a"/><path d="M640,0 Q600,150 640,262" fill="#13201a"/>
<text x="22" y="40" font-size="11" font-weight="700" fill="#8a93a6">CORNER</text><text x="618" y="40" font-size="11" font-weight="700" text-anchor="end" fill="#8a93a6">CORNER</text>
<path d="M320,92 C380,70 470,80 590,128" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="3 7" opacity=".6"/>
<g opacity="0.67" transform="translate(320 120) rotate(0)"><use href="#tcar"/></g>
<g opacity="0.67" transform="translate(320 92)"><use href="#tball"/></g>
<circle cx="286" cy="150" r="12" fill="#ff7a1a"/><text x="286" y="154.5" font-size="13" font-weight="800" text-anchor="middle" fill="#14161c">1</text>
<g opacity="0.83" transform="translate(420 112) rotate(55)"><use href="#tcar"/></g>
<g opacity="0.83" transform="translate(446 96)"><use href="#tball"/></g>
<circle cx="386" cy="142" r="12" fill="#ff7a1a"/><text x="386" y="146.5" font-size="13" font-weight="800" text-anchor="middle" fill="#14161c">2</text>
<g opacity="1.00" transform="translate(545 130) rotate(90)"><use href="#tcar"/></g>
<g opacity="1.00" transform="translate(586 128)"><use href="#tball"/></g>
<circle cx="511" cy="160" r="12" fill="#ff7a1a"/><text x="511" y="164.5" font-size="13" font-weight="800" text-anchor="middle" fill="#14161c">3</text>
<rect x="0" y="300" width="640" height="82" fill="#11141b"/>
<circle cx="26" cy="318" r="9" fill="#ff7a1a"/><text x="26" y="322" font-size="11" font-weight="800" text-anchor="middle" fill="#14161c">1</text><text x="44" y="322" font-size="14" fill="#e9ecf2">Meet it high and take a soft first touch on the top-front of your car</text>
<circle cx="26" cy="340" r="9" fill="#ff7a1a"/><text x="26" y="344" font-size="11" font-weight="800" text-anchor="middle" fill="#14161c">2</text><text x="44" y="344" font-size="14" fill="#e9ecf2">Carry it along the wall with small touches</text>
<circle cx="26" cy="362" r="9" fill="#ff7a1a"/><text x="26" y="366" font-size="11" font-weight="800" text-anchor="middle" fill="#14161c">3</text><text x="44" y="366" font-size="14" fill="#e9ecf2">Dump it into the corner, or pass to a teammate</text>
<text x="628" y="374" font-size="11" text-anchor="end" fill="#8a93a6">Looking at your backwall · simplified illustration</text>
</svg>
